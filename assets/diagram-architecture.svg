<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="100%" stop-color="#0f1523" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b44" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .flow-particle {
        stroke-dasharray: 8 16;
        animation: flowAnim 2.5s linear infinite;
      }
      @keyframes flowAnim {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      .pulse-node {
        animation: pulseNode 2.2s ease-in-out infinite alternate;
      }
      @keyframes pulseNode {
        0% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(255, 75, 68, 0.4)); }
        100% { transform: scale(1.02); filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.7)); }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="960" height="480" rx="16" fill="url(#bgGradArch)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800">
      SYSTEM ARCHITECTURE &amp; DATA PIPELINE
    </text>
    <text x="0" y="22" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">
      Mediacoach Optical Telemetry Ingestion to Real-Time Synchronized Consumer Touchpoints
    </text>
  </g>

  <!-- COLUMN 1: LIVE DATA INGESTION -->
  <g transform="translate(40, 95)">
    <!-- Column Container -->
    <rect width="250" height="345" rx="12" fill="rgba(18, 24, 38, 0.7)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <rect x="0" y="0" width="250" height="36" rx="12" fill="rgba(255, 75, 68, 0.12)" />
    <text x="16" y="23" fill="#ff4b44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      1. OPTICAL &amp; DATA INGESTION
    </text>

    <!-- Node 1: Mediacoach TRACAB -->
    <g transform="translate(16, 52)">
      <rect width="218" height="74" rx="8" fill="#121724" stroke="rgba(255, 75, 68, 0.4)" stroke-width="1" />
      <circle cx="20" cy="24" r="6" fill="#ff4b44" />
      <text x="34" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Sportian Mediacoach</text>
      <text x="16" y="48" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">TRACAB® 25fps Optical Mesh</text>
      <text x="16" y="62" fill="#00f0ff" font-family="monospace" font-size="9">150,000 spatial points/min</text>
    </g>

    <!-- Node 2: Azure Beyond Stats -->
    <g transform="translate(16, 142)">
      <rect width="218" height="74" rx="8" fill="#121724" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
      <circle cx="20" cy="24" r="6" fill="#00f0ff" />
      <text x="34" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Microsoft Azure ML</text>
      <text x="16" y="48" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Beyond Stats Predictive Models</text>
      <text x="16" y="62" fill="#ffd159" font-family="monospace" font-size="9">xG, Sprints, Passing Lanes</text>
    </g>

    <!-- Node 3: Official Match Feed -->
    <g transform="translate(16, 232)">
      <rect width="218" height="74" rx="8" fill="#121724" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <circle cx="20" cy="24" r="6" fill="#94a3b8" />
      <text x="34" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">LALIGA Match Events</text>
      <text x="16" y="48" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Official Stats Perform API</text>
      <text x="16" y="62" fill="#94a3b8" font-family="monospace" font-size="9">Cards, Subs, VAR Timestamps</text>
    </g>
  </g>

  <!-- FLOW PATHS 1 TO 2 -->
  <g stroke="url(#streamGrad1)" stroke-width="2.5" fill="none">
    <path class="flow-particle" d="M 290 185 L 360 265" />
    <path class="flow-particle" d="M 290 275 L 360 265" />
    <path class="flow-particle" d="M 290 365 L 360 265" />
  </g>

  <!-- COLUMN 2: LALIGA PULSE CORE ENGINE -->
  <g transform="translate(360, 95)">
    <!-- Column Container -->
    <rect width="240" height="345" rx="12" fill="rgba(20, 27, 44, 0.85)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="36" rx="12" fill="rgba(0, 240, 255, 0.15)" />
    <text x="16" y="23" fill="#00f0ff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      2. LALIGA PULSE CORE
    </text>

    <!-- Core Engine Inner Components -->
    <g transform="translate(14, 52)">
      <!-- Real-Time Event Broker -->
      <rect width="212" height="58" rx="8" fill="#0d121c" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="14" y="26" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Real-Time Event Broker</text>
      <text x="14" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Apache Kafka • &lt;200ms latency</text>

      <!-- Game State Machine -->
      <g transform="translate(0, 68)">
        <rect width="212" height="58" rx="8" fill="#0d121c" stroke="rgba(255, 75, 68, 0.4)" />
        <text x="14" y="26" fill="#ff736d" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Tactical State Machine</text>
        <text x="14" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Dynamic 15s Prompt Generator</text>
      </g>

      <!-- Adaptive Latency Buffer -->
      <g transform="translate(0, 136)">
        <rect width="212" height="58" rx="8" fill="#0d121c" stroke="rgba(0, 240, 255, 0.4)" />
        <text x="14" y="26" fill="#70f8ff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Adaptive Latency Buffer</text>
        <text x="14" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">HLS Timed ID3 / Audio Sync</text>
      </g>

      <!-- Pulse Loyalty Settlement -->
      <g transform="translate(0, 204)">
        <rect width="212" height="58" rx="8" fill="#0d121c" stroke="rgba(255, 209, 89, 0.4)" />
        <text x="14" y="26" fill="#ffd159" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">FinTech Loyalty Ledger</text>
        <text x="14" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Instant $PULSE Credit Minting</text>
      </g>
    </g>
  </g>

  <!-- FLOW PATHS 2 TO 3 -->
  <g stroke="url(#streamGrad1)" stroke-width="2.5" fill="none">
    <path class="flow-particle" d="M 600 265 L 670 145" />
    <path class="flow-particle" d="M 600 265 L 670 225" />
    <path class="flow-particle" d="M 600 265 L 670 305" />
    <path class="flow-particle" d="M 600 265 L 670 385" />
  </g>

  <!-- COLUMN 3: TOUCHPOINTS & ECOSYSTEM -->
  <g transform="translate(670, 95)">
    <!-- Column Container -->
    <rect width="250" height="345" rx="12" fill="rgba(18, 24, 38, 0.7)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <rect x="0" y="0" width="250" height="36" rx="12" fill="rgba(255, 209, 89, 0.12)" />
    <text x="16" y="23" fill="#ffd159" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      3. CONNECTED ECOSYSTEM
    </text>

    <!-- Endpoint 1: LALIGA Official App & Fantasy -->
    <g transform="translate(14, 46)">
      <rect width="222" height="62" rx="8" fill="#121724" stroke="rgba(255, 75, 68, 0.3)" />
      <text x="14" y="25" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Official App &amp; Fantasy SDK</text>
      <text x="14" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Modular Micro-Frontend • SSO</text>
    </g>

    <!-- Endpoint 2: LALIGA+ OTT -->
    <g transform="translate(14, 116)">
      <rect width="222" height="62" rx="8" fill="#121724" stroke="rgba(0, 240, 255, 0.3)" />
      <text x="14" y="25" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">LALIGA+ (OTT Interactive)</text>
      <text x="14" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Synced Video Overlay Graphics</text>
    </g>

    <!-- Endpoint 3: Mediapro Broadcast Keyer -->
    <g transform="translate(14, 186)">
      <rect width="222" height="62" rx="8" fill="#121724" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="14" y="25" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Mediapro TV Lower-Third</text>
      <text x="14" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Live Global Crowd Consensus Bug</text>
    </g>

    <!-- Endpoint 4: In-Stadium Geo-Pulse -->
    <g transform="translate(14, 256)">
      <rect width="222" height="62" rx="8" fill="#121724" stroke="rgba(255, 209, 89, 0.3)" />
      <text x="14" y="25" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">In-Stadium BLE Geo-Pulse</text>
      <text x="14" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Haptics • Flashlights • Jumbotrons</text>
    </g>
  </g>
</svg>
