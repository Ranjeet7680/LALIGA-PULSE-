<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10" />
      <stop offset="100%" stop-color="#111726" />
    </linearGradient>

    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b44" />
      <stop offset="50%" stop-color="#ffd159" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <style>
      .timer-spin {
        transform-origin: 480px 240px;
        animation: spinTimer 8s linear infinite;
      }
      @keyframes spinTimer {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .orbit-dash {
        stroke-dasharray: 12 18;
        animation: dashOrbit 3s linear infinite;
      }
      @keyframes dashOrbit {
        to { stroke-dashoffset: -90; }
      }
      .pulse-core {
        animation: coreBreath 2s ease-in-out infinite alternate;
      }
      @keyframes coreBreath {
        0% { transform: scale(0.96); filter: drop-shadow(0 0 8px rgba(255, 75, 68, 0.4)); }
        100% { transform: scale(1.04); filter: drop-shadow(0 0 22px rgba(255, 75, 68, 0.8)); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGradLoop)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800">
      IN-MATCH MICRO-TACTIX: 15-SECOND EXECUTION LOOP
    </text>
    <text x="0" y="22" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">
      Sub-Second Optical Ingest, Synchronous Crowdsourcing &amp; Automated Settlement
    </text>
  </g>

  <!-- Big Central Orbit Track -->
  <circle cx="480" cy="265" r="145" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" />
  <circle cx="480" cy="265" r="145" fill="none" stroke="url(#loopGrad)" stroke-width="3" class="orbit-dash" />

  <!-- Center Hub: Real-Time Sync Clock -->
  <g transform="translate(480, 265)" class="pulse-core">
    <circle cx="0" cy="0" r="54" fill="#141926" stroke="#ff4b44" stroke-width="2" />
    <circle cx="0" cy="0" r="46" fill="rgba(255, 75, 68, 0.1)" />
    <text x="0" y="-8" fill="#ff4b44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" text-anchor="middle">SYNC CLOCK</text>
    <text x="0" y="14" fill="#ffffff" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">15.0s</text>
    <text x="0" y="28" fill="#00f0ff" font-family="monospace" font-size="9" text-anchor="middle">25 FPS TRACAB</text>
  </g>

  <!-- STAGE 1 (TOP): Optical Trigger -->
  <g transform="translate(480, 95)">
    <circle cx="0" cy="0" r="22" fill="#ff4b44" />
    <text x="0" y="5" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">1</text>
    <rect x="-115" y="-55" width="230" height="42" rx="8" fill="#121724" stroke="rgba(255, 75, 68, 0.4)" stroke-width="1" />
    <text x="0" y="-37" fill="#ff736d" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">TACTICAL EVENT TRIGGER</text>
    <text x="0" y="-21" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Mediacoach detects high xG or 1v1</text>
  </g>

  <!-- STAGE 2 (RIGHT): 15s Synchronous Window -->
  <g transform="translate(645, 235)">
    <circle cx="0" cy="0" r="22" fill="#ffd159" />
    <text x="0" y="5" fill="#000000" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">2</text>
    <rect x="25" y="-28" width="240" height="56" rx="8" fill="#121724" stroke="rgba(255, 209, 89, 0.4)" stroke-width="1" />
    <text x="37" y="-8" fill="#ffd159" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">15s CO-OP FAN PROMPT</text>
    <text x="37" y="9" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Global push notification &amp; haptic pulse</text>
    <text x="37" y="22" fill="#00f0ff" font-family="monospace" font-size="9">Option A (64%) vs Option B (36%)</text>
  </g>

  <!-- STAGE 3 (BOTTOM RIGHT): Crowd Aggregation -->
  <g transform="translate(565, 395)">
    <circle cx="0" cy="0" r="20" fill="#00f0ff" />
    <text x="0" y="5" fill="#000000" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" text-anchor="middle">3</text>
    <rect x="-90" y="24" width="180" height="40" rx="8" fill="#121724" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
    <text x="0" y="41" fill="#00f0ff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CROWD IQ CALCULATED</text>
    <text x="0" y="55" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Mediapro TV Lower-Third updates</text>
  </g>

  <!-- STAGE 4 (BOTTOM LEFT): Sub-3s Optical Verification -->
  <g transform="translate(395, 395)">
    <circle cx="0" cy="0" r="20" fill="#34d399" />
    <text x="0" y="5" fill="#000000" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" text-anchor="middle">4</text>
    <rect x="-90" y="24" width="180" height="40" rx="8" fill="#121724" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
    <text x="0" y="41" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">OPTICAL VERIFICATION</text>
    <text x="0" y="55" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Outcome settled in &lt;2.4s via TRACAB</text>
  </g>

  <!-- STAGE 5 (LEFT): Instant Pulse Credits Settlement -->
  <g transform="translate(315, 235)">
    <circle cx="0" cy="0" r="22" fill="#ff4b44" />
    <text x="0" y="5" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">5</text>
    <rect x="-240" y="-28" width="220" height="56" rx="8" fill="#121724" stroke="rgba(255, 75, 68, 0.4)" stroke-width="1" />
    <text x="-228" y="-8" fill="#ff736d" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">INSTANT SETTLEMENT</text>
    <text x="-228" y="9" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">+250 $PULSE credited to wallet</text>
    <text x="-228" y="22" fill="#ffd159" font-family="monospace" font-size="9">Peña Clan leaderboard points updated</text>
  </g>
</svg>
