<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>

    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd159" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>

    <style>
      .coin-flow {
        stroke-dasharray: 6 12;
        animation: coinRun 2s linear infinite;
      }
      @keyframes coinRun {
        to { stroke-dashoffset: -36; }
      }
      .shield-glow {
        animation: shieldBreath 3s ease-in-out infinite alternate;
      }
      @keyframes shieldBreath {
        0% { filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.4)); }
        100% { filter: drop-shadow(0 0 18px rgba(52, 211, 153, 0.8)); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" rx="16" fill="url(#bgGradFin)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800">
      FINTECH VALUE LOOP &amp; CLOSED-LOOP LOYALTY ECONOMY
    </text>
    <text x="0" y="22" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">
      Zero-Speculation Loyalty Token Architecture • Dubai FinTech Summit Monetization Model
    </text>
  </g>

  <!-- LEFT: SPONSOR & FINTECH INJECTION -->
  <g transform="translate(50, 100)">
    <rect width="250" height="330" rx="12" fill="#121724" stroke="rgba(255, 209, 89, 0.3)" stroke-width="1" />
    <rect x="0" y="0" width="250" height="36" rx="12" fill="rgba(255, 209, 89, 0.12)" />
    <text x="16" y="23" fill="#ffd159" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
      1. CAPITAL &amp; SPONSOR INJECTION
    </text>

    <!-- Sponsor Card 1: Decision Windows -->
    <g transform="translate(14, 50)">
      <rect width="222" height="65" rx="8" fill="#181f30" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="22" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Sponsored Tactical Moments</text>
      <text x="12" y="40" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">EA SPORTS, Puma, Azure ML</text>
      <text x="12" y="54" fill="#ffd159" font-family="monospace" font-size="9">Sponsored 15s Decision Windows</text>
    </g>

    <!-- Sponsor Card 2: Regional FinTech Banking -->
    <g transform="translate(14, 125)">
      <rect width="222" height="65" rx="8" fill="#181f30" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="22" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">MENA &amp; Global FinTech Partners</text>
      <text x="12" y="40" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Dubai FinTech, Digital Wallets</text>
      <text x="12" y="54" fill="#00f0ff" font-family="monospace" font-size="9">Card-linked merchant discounts</text>
    </g>

    <!-- Sponsor Card 3: First-Party Data -->
    <g transform="translate(14, 200)">
      <rect width="222" height="65" rx="8" fill="#181f30" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="22" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">B2B Fan Intelligence Capital</text>
      <text x="12" y="40" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Zero-Party Behavioral Insights</text>
      <text x="12" y="54" fill="#34d399" font-family="monospace" font-size="9">Commercial rights valuation surge</text>
    </g>

    <text x="16" y="305" fill="#ffd159" font-family="monospace" font-size="10" font-weight="700">
      Direct Revenue &amp; Liquidity Pool
    </text>
  </g>

  <!-- FLOW BEAMS LEFT TO CENTER -->
  <g stroke="#ffd159" stroke-width="2" fill="none">
    <path class="coin-flow" d="M 300 240 L 370 240" />
  </g>

  <!-- CENTER: THE CLOSED-LOOP PULSE LEDGER -->
  <g transform="translate(370, 100)">
    <rect width="220" height="330" rx="12" fill="#161c2b" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" />
    <rect x="0" y="0" width="220" height="36" rx="12" fill="rgba(0, 240, 255, 0.15)" />
    <text x="16" y="23" fill="#00f0ff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
      2. $PULSE UTILITY LEDGER
    </text>

    <!-- Central Token Graphic -->
    <g transform="translate(110, 115)">
      <circle cx="0" cy="0" r="48" fill="#1c2438" stroke="#ff4b44" stroke-width="2" />
      <circle cx="0" cy="0" r="38" fill="rgba(255, 75, 68, 0.15)" />
      <text x="0" y="-4" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="900" text-anchor="middle">$PULSE</text>
      <text x="0" y="14" fill="#ffd159" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">LOYALTY XP</text>
    </g>

    <!-- Token Mechanics -->
    <g transform="translate(14, 185)">
      <rect width="192" height="70" rx="6" fill="#10141f" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="10" y="20" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">• Sweat-Equity Minting</text>
      <text x="10" y="36" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Earned via tactical accuracy</text>
      <text x="10" y="52" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">• Zero Speculation</text>
    </g>

    <!-- Non-Gambling Compliance Badge -->
    <g transform="translate(14, 270)" class="shield-glow">
      <rect width="192" height="45" rx="6" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.5)" stroke-width="1" />
      <text x="10" y="20" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800">100% FREE-TO-PLAY</text>
      <text x="10" y="34" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">DGOJ, UAE SCA &amp; GDPR Cleared</text>
    </g>
  </g>

  <!-- FLOW BEAMS CENTER TO RIGHT -->
  <g stroke="#00f0ff" stroke-width="2" fill="none">
    <path class="coin-flow" d="M 590 240 L 660 240" />
  </g>

  <!-- RIGHT: REAL-WORLD FAN REWARD REDEMPTION -->
  <g transform="translate(660, 100)">
    <rect width="250" height="330" rx="12" fill="#121724" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
    <rect x="0" y="0" width="250" height="36" rx="12" fill="rgba(52, 211, 153, 0.12)" />
    <text x="16" y="23" fill="#6ee7b7" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
      3. FAN VALUE REDEMPTION
    </text>

    <!-- Reward Item 1 -->
    <g transform="translate(14, 50)">
      <rect width="222" height="60" rx="8" fill="#181f30" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="20" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Official Club Jerseys &amp; Gear</text>
      <text x="12" y="36" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Direct store fulfillment</text>
      <text x="12" y="50" fill="#ff4b44" font-family="monospace" font-size="9">4,500 $PULSE</text>
    </g>

    <!-- Reward Item 2 -->
    <g transform="translate(14, 120)">
      <rect width="222" height="60" rx="8" fill="#181f30" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="20" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">LALIGA+ All-Access Passes</text>
      <text x="12" y="36" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">1-Month multi-device streaming</text>
      <text x="12" y="50" fill="#00f0ff" font-family="monospace" font-size="9">1,500 $PULSE</text>
    </g>

    <!-- Reward Item 3 -->
    <g transform="translate(14, 190)">
      <rect width="222" height="60" rx="8" fill="#181f30" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="20" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Dubai FinTech Summit VIP Pass</text>
      <text x="12" y="36" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Innovation stage executive access</text>
      <text x="12" y="50" fill="#ffd159" font-family="monospace" font-size="9">3,000 $PULSE</text>
    </g>

    <text x="16" y="290" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">
      Loop Complete: High Fandom Retention
    </text>
    <text x="16" y="308" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">
      D30 Retention: 54% (+145% uplift)
    </text>
  </g>
</svg>
