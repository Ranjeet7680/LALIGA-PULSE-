<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f1420" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="laligaRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b44" />
      <stop offset="100%" stop-color="#ff736d" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#70f8ff" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd159" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-line {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: dash 3.5s linear infinite;
      }
      @keyframes dash {
        0% { stroke-dashoffset: 600; opacity: 0.2; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -600; opacity: 0.2; }
      }
      .beacon-dot {
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes ping {
        0% { transform: scale(1); opacity: 1; }
        75%, 100% { transform: scale(2.4); opacity: 0; }
      }
      .badge-glow {
        animation: breath 3s ease-in-out infinite alternate;
      }
      @keyframes breath {
        0% { opacity: 0.7; }
        100% { opacity: 1; filter: drop-shadow(0 0 12px rgba(255, 75, 68, 0.6)); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="20" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Background Stadium Lights Pattern -->
  <circle cx="150" cy="50" r="180" fill="#ff4b44" opacity="0.08" filter="blur(60px)" />
  <circle cx="850" cy="270" r="180" fill="#00f0ff" opacity="0.07" filter="blur(60px)" />

  <!-- Subtle Tactical Pitch Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="50" y1="80" x2="950" y2="80" />
    <line x1="50" y1="160" x2="950" y2="160" />
    <line x1="50" y1="240" x2="950" y2="240" />
    <line x1="250" y1="40" x2="250" y2="280" />
    <line x1="500" y1="40" x2="500" y2="280" stroke-dasharray="4 4" />
    <line x1="750" y1="40" x2="750" y2="280" />
  </g>

  <!-- Animated Real-Time Optical Telemetry Pulse Line -->
  <path class="pulse-line" d="M 50 240 L 220 240 L 260 210 L 300 270 L 340 190 L 380 250 L 420 240 L 680 240 L 720 200 L 760 260 L 800 230 L 950 230" 
        fill="none" stroke="url(#laligaRedGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Badges / Metadata Ribbon -->
  <g transform="translate(60, 45)">
    <!-- Competition Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(255, 75, 68, 0.15)" stroke="rgba(255, 75, 68, 0.4)" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#ff4b44" />
    <circle cx="14" cy="14" r="5" fill="#ff4b44" class="beacon-dot" />
    <text x="28" y="18" fill="#ff736d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">BEYOND THE MATCH CHALLENGE</text>

    <!-- Host / Summit Tag -->
    <rect x="232" y="0" width="250" height="28" rx="14" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
    <text x="246" y="18" fill="#70f8ff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DUBAI FINTECH SUMMIT • IGNYTE</text>

    <!-- $10k Award Badge -->
    <rect x="494" y="0" width="145" height="28" rx="14" fill="rgba(255, 209, 89, 0.15)" stroke="rgba(255, 209, 89, 0.4)" stroke-width="1" />
    <text x="508" y="18" fill="#ffd159" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800">USD 10,000 PRIZE</text>
  </g>

  <!-- Main Brand Title Area -->
  <g transform="translate(60, 140)">
    <!-- LALIGA Logo Mark -->
    <rect x="0" y="-32" width="56" height="56" rx="14" fill="#ff4b44" filter="url(#glowRed)" />
    <text x="28" y="4" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="-1">LL</text>

    <!-- Brand Typography -->
    <text x="74" y="8" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="1">LALIGA</text>
    <text x="240" y="8" fill="url(#laligaRedGrad)" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="1.5">PULSE</text>
    <text x="390" y="-12" fill="#00f0ff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800">TM</text>

    <!-- Tagline -->
    <text x="76" y="38" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="500">
      The Synchronous Live Match Arena, Optical Intelligence &amp; Fan Capital Network
    </text>
  </g>

  <!-- Right Floating Metric Badges -->
  <g transform="translate(690, 85)">
    <!-- Card 1: Optical Tracking Sync -->
    <rect x="0" y="0" width="250" height="65" rx="12" fill="rgba(20, 26, 38, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="24" cy="32" r="6" fill="#00f0ff" />
    <circle cx="24" cy="32" r="10" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />
    <text x="42" y="27" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">TELEMETRY INGEST</text>
    <text x="42" y="46" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Mediacoach TRACAB® 25fps</text>

    <!-- Card 2: Engagement Multiplier -->
    <rect x="0" y="75" width="250" height="65" rx="12" fill="rgba(20, 26, 38, 0.85)" stroke="rgba(255, 75, 68, 0.3)" stroke-width="1" class="badge-glow" />
    <text x="20" y="102" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">CONCURRENT SCREEN TIME</text>
    <text x="20" y="123" fill="#ff4b44" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800">+277% Uplift (68 Mins Avg)</text>
  </g>
</svg>
